# Server Port
server.port=8081

# Active Profile: 'local' (H2 in Postgres mode) by default for zero-friction local run.
# Set to 'postgres' to use an external PostgreSQL database.
spring.profiles.active=local

# JPA Common Settings
spring.jpa.open-in-view=true

# Mail Settings (with safe defaults to prevent placeholder resolution errors)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Management Endpoints
management.endpoints.web.exposure.include=*

# Security & Logging
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.tool.schema=WARN

# JWT Secret Configuration (overridable via JWT_SECRET env var)
jwt.secret=${JWT_SECRET:mysecretkeymysecretkeymysecretkey123456}